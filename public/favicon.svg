<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#111118"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/> <!-- Green -->
      <stop offset="100%" stop-color="#22d3ee"/> <!-- Cyan -->
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Glowing Circular Border -->
  <circle cx="256" cy="256" r="210" stroke="url(#accGrad)" stroke-width="16" filter="url(#glow)" fill="none"/>

  <!-- Glowing TM Initials -->
  <g stroke="url(#accGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Letter T -->
    <path d="M 131 180 H 241" />
    <path d="M 186 180 V 340" />
    <!-- Letter M -->
    <path d="M 271 340 V 180 L 326 270 L 381 180 V 340" />
  </g>
</svg>